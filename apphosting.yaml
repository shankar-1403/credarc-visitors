# Firebase App Hosting environment config.
#
# .env.local is git-ignored on purpose and never reaches a deployed build —
# this file is what actually supplies environment variables to App Hosting.
# The NEXT_PUBLIC_* values below are safe as plaintext: they're the same
# client-side Firebase config already visible to anyone in the browser.
# Everything else is a real credential and goes through Secret Manager
# instead of being pasted here — see the setup commands below.

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCUg_n49HXFgK7cgplbr2dz4q4tTorVjzY"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "credarc-visiting-system.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://credarc-visiting-system-default-rtdb.asia-southeast1.firebasedatabase.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "credarc-visiting-system"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "credarc-visiting-system.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "17330801437"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:17330801437:web:ab4b3f18ca371c7fb56ff4"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: "BHxa26aer027gToaLn6ZT9KUU1-x1S997E_vcoLz-SvJQ3ouKEodNYkRIRWQHn9YI4g_UALkN2MiuXOa7IjiL0I"
    availability:
      - BUILD
      - RUNTIME

  # --- Real credentials: set with `firebase apphosting:secrets:set <name>`,
  # then this file just references the secret by name, never the value.
  # Named ADMIN_SDK_* rather than FIREBASE_ADMIN_* — App Hosting reserves any
  # variable starting with FIREBASE_ (also X_GOOGLE_, EXT_, KIT_) for itself.
  - variable: ADMIN_SDK_CLIENT_EMAIL
    secret: firebase-admin-client-email
    availability:
      - RUNTIME

  - variable: ADMIN_SDK_PRIVATE_KEY
    secret: firebase-admin-private-key
    availability:
      - RUNTIME

  - variable: SMTP_USER
    secret: smtp-user
    availability:
      - RUNTIME

  - variable: SMTP_PASS
    secret: smtp-pass
    availability:
      - RUNTIME
